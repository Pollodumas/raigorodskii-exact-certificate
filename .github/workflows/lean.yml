name: Lean CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lake dependencies
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lakefile.toml') }}
      - name: Update dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Test derivative scratch
        run: lake env lean lean/DerivativeScratch.lean
      - name: Test integrality scratch
        run: lake env lean lean/IntegralScratch.lean
      - name: Probe finite-field irreducibility scratch
        continue-on-error: true
        run: lake env lean lean/IrreducibleScratch.lean
      - name: Apply proved patches
        run: python3 scripts/patch_derivatives.py
      - name: Build certificate
        run: lake build
      - name: Report remaining sorry declarations
        if: always()
        run: |
          grep -RIn --include='*.lean' '\bsorry\b' lean || true
      - name: Upload generated sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-lean-files
          path: |
            lean/RaigorodskiiCertificate.lean
            lake-manifest.json
          if-no-files-found: error
