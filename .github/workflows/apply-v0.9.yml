name: Apply reviewed v0.9 tree

on:
  push:
    branches: [review-v0.9]
    paths:
      - ".github/workflows/apply-v0.9.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: review-v0.9
          fetch-depth: 0

      - name: Restore verified source tree
        run: |
          cp .github/workflows/verify.yml /tmp/verify.yml
          cat \
            .review-payload/part-00 \
            .review-payload/part-01-00 \
            .review-payload/part-01-01 \
            .review-payload/part-01-02 \
            .review-payload/part-01-03 \
            .review-payload/part-01-04-0 \
            .review-payload/part-01-04-1 \
            .review-payload/part-01-05-0 \
            .review-payload/part-01-05-1 \
            .review-payload/part-01-06-0 \
            .review-payload/part-01-06-1 \
            .review-payload/part-01-07-0 \
            .review-payload/part-01-07-1 \
            .review-payload/part-01-08-0 \
            .review-payload/part-01-08-1 \
            .review-payload/part-02 \
            .review-payload/part-03 \
            .review-payload/part-04 \
            .review-payload/part-05 \
            > /tmp/raigorodskii-v0.9.b64
          echo "fc2beb8e7f5d9d4a30c220d592ce79c704a5a850ceb7c46b6ff7767423417260  /tmp/raigorodskii-v0.9.b64" | sha256sum -c -
          base64 --decode /tmp/raigorodskii-v0.9.b64 > /tmp/raigorodskii-v0.9.tar.gz
          echo "9f583713d068a3cd48001b884449fa9763f450c7de555868ff0f6f2025262a99  /tmp/raigorodskii-v0.9.tar.gz" | sha256sum -c -
          tar -xzf /tmp/raigorodskii-v0.9.tar.gz
          cp /tmp/verify.yml .github/workflows/verify.yml

      - name: Remove transfer and superseded files
        run: |
          rm -rf .review-payload
          rm -f paper/Raigorodskii_Exact_Certificate_Draft_v0_8.pdf
          rm -f paper/Raigorodskii_Exact_Certificate_Draft_v0_8.tex
          rm -f verification/*v0_8*
          rm -f dist/Raigorodskii_Exact_Certificate_v0_8.zip

      - name: Commit reviewed v0.9 sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- ':!.github/workflows'
          git commit -m "Prepare reviewed publication sources v0.9"
          git push origin HEAD:review-v0.9
