name: Lean core

on:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Update dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Check main certificate
        run: lake env lean lean/RaigorodskiiCertificate.lean
      - name: Report remaining sorry declarations
        if: always()
        run: grep -n '\bsorry\b' lean/RaigorodskiiCertificate.lean || true
